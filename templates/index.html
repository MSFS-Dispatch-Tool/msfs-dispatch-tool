<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SimDispatch</title>
<style>
  :root {
    --face:        #ECE9D8;
    --face-dark:   #D4D0C8;
    --titlebar:    #6B7A99;
    --titlebar-2:  #93A3B8;
    --white:       #FFFFFF;
    --shadow-dk:   #716F64;
    --shadow-md:   #ACA899;
    --text:        #000000;
    --text-muted:  #444444;
    --amber:       #7A6A00;
    --amber-bg:    #F5EFC0;
    --green:       #245C24;
    --green-bg:    #DCEEDC;
    --red:         #FFFFFF;
    --red-bg:      #7A2626;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--face-dark);
    color: var(--text);
    font-family: 'Courier New', Consolas, monospace;
    font-size: 13px;
    line-height: 1.5;
  }

  .topbar {
    background: linear-gradient(90deg, var(--titlebar), var(--titlebar-2));
    color: #fff;
    padding: 5px 8px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 2px solid var(--shadow-dk);
  }
  .topbar .title { font-weight: 700; font-size: 13px; letter-spacing: 0.02em; }
  .topbar .clock { font-size: 12px; }

  main { max-width: 980px; margin: 16px auto; padding: 0 16px 60px; }

  .panel {
    background: var(--face);
    margin-bottom: 16px;
    border-style: solid; border-width: 2px;
    border-top-color: var(--white); border-left-color: var(--white);
    border-bottom-color: var(--shadow-dk); border-right-color: var(--shadow-dk);
  }
  .panel-header {
    background: linear-gradient(90deg, var(--titlebar), var(--titlebar-2));
    color: #fff; font-weight: 700; font-size: 12px;
    padding: 4px 8px;
  }
  .panel-body { padding: 12px 14px; }

  .params-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px 16px;
    margin-bottom: 12px;
  }
  @media (max-width: 560px) { .params-grid { grid-template-columns: 1fr; } }

  .field label { display: block; font-size: 12px; color: var(--text); margin-bottom: 3px; }
  .field .hint { color: var(--text-muted); font-size: 11px; font-weight: normal; }
  .field input, .field select {
    font-family: 'Courier New', Consolas, monospace; font-size: 13px; padding: 5px 7px;
    background: var(--white); color: var(--text); width: 100%;
    border-style: solid; border-width: 2px;
    border-top-color: var(--shadow-dk); border-left-color: var(--shadow-dk);
    border-bottom-color: var(--white); border-right-color: var(--white);
  }
  .field input:focus, .field select:focus { outline: 1px dotted var(--text); outline-offset: 1px; }
  .field-error { color: #7A2626; font-size: 11px; margin-top: 3px; display: none; }
  .field-error.show { display: block; }

  button.action {
    font-family: 'Courier New', Consolas, monospace; font-weight: 700; font-size: 13px;
    background: var(--face); color: var(--text); padding: 6px 20px; cursor: pointer;
    border-style: solid; border-width: 2px;
    border-top-color: var(--white); border-left-color: var(--white);
    border-bottom-color: var(--shadow-dk); border-right-color: var(--shadow-dk);
  }
  button.action:active {
    border-top-color: var(--shadow-dk); border-left-color: var(--shadow-dk);
    border-bottom-color: var(--white); border-right-color: var(--white);
  }
  button.action:disabled { color: var(--shadow-md); cursor: default; }
  button.action.small { padding: 3px 12px; font-size: 12px; }

  /* ---- toolbar: sort + filter ---- */
  .toolbar { display: flex; flex-wrap: wrap; gap: 14px; align-items: flex-end; margin-bottom: 10px; }
  .toolbar .field { min-width: 170px; }

  table.itin-list { width: 100%; border-collapse: collapse; }
  table.itin-list th {
    text-align: left; font-size: 11px; color: var(--text-muted); font-weight: normal;
    padding: 4px 6px; border-bottom: 2px solid var(--shadow-md); white-space: nowrap;
  }
  table.itin-list td { padding: 5px 6px; border-bottom: 1px solid var(--shadow-md); font-size: 12.5px; }
  table.itin-list tr.itin-row:hover { background: var(--face-dark); cursor: pointer; }
  table.itin-list tr.itin-row.expanded { background: #DDE3EE; }
  table.itin-list td.select-cell { width: 70px; }
  table.itin-list td.detail-cell { background: #F5F3EC; padding: 0; }

  .tag-domestic { color: var(--green); font-size: 11.5px; font-weight: 700; }
  .tag-international { color: #6B4B00; font-size: 11.5px; font-weight: 700; }

  /* ---- inline detail block ---- */
  .detail-inner { padding: 14px 16px; border-top: 2px solid var(--shadow-md); }
  .leg-block { margin-bottom: 14px; border: 1px solid var(--shadow-md); background: var(--white); }
  .leg-block-header {
    background: var(--face-dark); font-weight: 700; font-size: 12px; padding: 4px 8px;
    border-bottom: 1px solid var(--shadow-md);
  }
  .leg-block-body { padding: 10px 12px; }

  .kv { width: 100%; border-collapse: collapse; }
  .kv td { padding: 4px 0; border-bottom: 1px solid var(--shadow-md); vertical-align: top; }
  .kv tr:last-child td { border-bottom: none; }
  .kv td.k { color: var(--text); width: 40%; font-size: 12px; }
  .kv td.v { font-size: 13px; font-weight: 700; }

  .status-chip {
    display: inline-block; font-size: 11.5px; font-weight: 700; padding: 2px 8px; border: 1px solid var(--shadow-dk);
  }
  .status-ok    { background: var(--green-bg); color: var(--green); }
  .status-warn  { background: var(--amber-bg); color: var(--amber); }
  .status-alert { background: var(--red-bg);   color: var(--red); }

  .placeholder-text { color: var(--text); font-size: 12.5px; }
  .empty-state { padding: 26px 16px; text-align: center; color: var(--text-muted); font-size: 13px; }

  .mel-block { border: 1px solid var(--shadow-md); background: var(--white); margin-bottom: 14px; }

  .weather-block { border: 1px solid var(--shadow-md); background: #F7F6F1; padding: 8px 10px; }
  .weather-row { margin-bottom: 6px; }
  .weather-row:last-child { margin-bottom: 0; }
  .weather-label { display: block; font-size: 10.5px; color: var(--text-muted); font-weight: 700; }
  .weather-text { display: block; font-size: 12px; word-break: break-word; }

  .generate-row { text-align: right; margin-top: 6px; }

  footer { max-width: 980px; margin: 0 auto; padding: 0 16px 30px; color: #3A3A3A; font-size: 11px; }
</style>
</head>
<body>

<div class="topbar">
  <div class="title">SimDispatch</div>
  <div class="clock" id="clock">--:--:--Z</div>
</div>

<main>

  <div class="panel">
    <div class="panel-header">SEARCH PARAMETERS</div>
    <div class="panel-body">
      <div class="params-grid">
        <div class="field">
          <label for="origin">PREFERRED BASE <span class="hint">(ICAO/IATA, optional)</span></label>
          <input type="text" id="origin" list="airportList" autocomplete="off" placeholder="e.g. BGY or LIME">
          <div class="field-error" id="originError">UNKNOWN AIRPORT CODE</div>
        </div>
        <div class="field">
          <label for="destination">PREFERRED DESTINATION <span class="hint">(ICAO/IATA, optional)</span></label>
          <input type="text" id="destination" list="airportList" autocomplete="off" placeholder="e.g. STN or EGSS">
          <div class="field-error" id="destinationError">UNKNOWN AIRPORT CODE</div>
        </div>
        <div class="field">
          <label for="minutes">TIME AVAILABLE (MIN)</label>
          <input type="number" id="minutes" value="180" min="20" step="5">
        </div>
        <div class="field">
          <label for="legs">NUMBER OF LEGS</label>
          <select id="legs">
            <option value="">AUTO</option>
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
          </select>
        </div>
      </div>
      <datalist id="airportList"></datalist>
      <button class="action" id="searchBtn" onclick="searchFlights()">SEARCH</button>
    </div>
  </div>

  <div id="listPanel"></div>

</main>

<footer>
  DATASET: {{ counts.routes }} ROUTES &middot; {{ counts.mels }} MEL SCENARIOS &middot; {{ counts.delay_codes }} DELAY CODES
</footer>

<script>
function updateClock() {
  const now = new Date();
  const hh = String(now.getUTCHours()).padStart(2, '0');
  const mm = String(now.getUTCMinutes()).padStart(2, '0');
  const ss = String(now.getUTCSeconds()).padStart(2, '0');
  document.getElementById('clock').textContent = `${hh}:${mm}:${ss}Z`;
}
updateClock();
setInterval(updateClock, 1000);

function fmtMinutes(min) {
  const h = Math.floor(min / 60);
  const m = min % 60;
  return `${h}H${String(m).padStart(2, '0')}M`;
}

// ---- airport autocomplete ----
async function updateAirportList(query) {
  if (!query || query.length < 1) return;
  const resp = await fetch(`/airports/search?q=${encodeURIComponent(query)}`);
  const matches = await resp.json();
  const list = document.getElementById('airportList');
  list.innerHTML = '';
  matches.forEach(a => {
    const opt = document.createElement('option');
    opt.value = a.icao;
    opt.label = `${a.icao} / ${a.iata} - ${a.city}`;
    list.appendChild(opt);
  });
}
['origin', 'destination'].forEach(id => {
  document.getElementById(id).addEventListener('input', (e) => updateAirportList(e.target.value));
});

async function validateAirport(fieldId) {
  const field = document.getElementById(fieldId);
  const errorEl = document.getElementById(fieldId + 'Error');
  const value = field.value.trim();
  if (!value) { errorEl.classList.remove('show'); return true; }
  const resp = await fetch(`/airports/validate?code=${encodeURIComponent(value)}`);
  const result = await resp.json();
  errorEl.classList.toggle('show', !result.valid);
  return result.valid;
}
['origin', 'destination'].forEach(id => {
  document.getElementById(id).addEventListener('blur', () => validateAirport(id));
});

// ---- search ----
let currentItineraries = [];
let expandedKey = null;

async function searchFlights() {
  const originValid = await validateAirport('origin');
  const destValid = await validateAirport('destination');
  if (!originValid || !destValid) return;

  const origin = document.getElementById('origin').value.trim();
  const destination = document.getElementById('destination').value.trim();
  const minutes = document.getElementById('minutes').value;
  const legs = document.getElementById('legs').value;

  const btn = document.getElementById('searchBtn');
  btn.disabled = true;
  btn.textContent = 'SEARCHING...';

  try {
    const params = new URLSearchParams({ minutes, legs, origin, destination });
    const resp = await fetch(`/search?${params}`);
    const data = await resp.json();

    if (data.error) {
      document.getElementById('listPanel').innerHTML = `<div class="panel"><div class="empty-state">${data.error}</div></div>`;
      return;
    }
    if (data.count === 0) {
      document.getElementById('listPanel').innerHTML = `<div class="panel"><div class="empty-state">NO ITINERARIES MATCH THESE PARAMETERS. WIDEN THE TIME AVAILABLE OR CLEAR A FILTER.</div></div>`;
      return;
    }

    currentItineraries = data.itineraries;
    expandedKey = null;
    renderListPanel();
  } catch (err) {
    document.getElementById('listPanel').innerHTML = `<div class="panel"><div class="empty-state">SEARCH FAILED. CHECK CONNECTION AND RETRY.</div></div>`;
  } finally {
    btn.disabled = false;
    btn.textContent = 'SEARCH';
  }
}

function itinKey(itin) { return itin.flight_numbers.join(','); }

function applySortAndFilter(list) {
  const sortBy = document.getElementById('sortBy') ? document.getElementById('sortBy').value : 'flight';
  const showFilter = document.getElementById('showFilter') ? document.getElementById('showFilter').value : 'all';

  let filtered = list;
  if (showFilter === 'domestic') filtered = list.filter(i => i.domestic);
  if (showFilter === 'international') filtered = list.filter(i => !i.domestic);

  const sorted = [...filtered];
  if (sortBy === 'flight') sorted.sort((a, b) => a.flight_numbers[0].localeCompare(b.flight_numbers[0], undefined, {numeric: true}));
  if (sortBy === 'legs') sorted.sort((a, b) => a.legs - b.legs);
  if (sortBy === 'departure') sorted.sort((a, b) => a.departure_icao.localeCompare(b.departure_icao));
  if (sortBy === 'arrival') sorted.sort((a, b) => a.arrival_icao.localeCompare(b.arrival_icao));
  return sorted;
}

function renderListPanel() {
  document.getElementById('listPanel').innerHTML = `
    <div class="panel">
      <div class="panel-header">MATCHING ITINERARIES</div>
      <div class="panel-body">
        <div class="toolbar">
          <div class="field">
            <label for="sortBy">SORT BY</label>
            <select id="sortBy" onchange="renderTable()">
              <option value="flight">FLIGHT NUMBER</option>
              <option value="legs">NUMBER OF LEGS</option>
              <option value="departure">DEPARTURE (A-Z)</option>
              <option value="arrival">ARRIVAL (A-Z)</option>
            </select>
          </div>
          <div class="field">
            <label for="showFilter">SHOW</label>
            <select id="showFilter" onchange="renderTable()">
              <option value="all">ALL</option>
              <option value="domestic">DOMESTIC ONLY</option>
              <option value="international">INTERNATIONAL ONLY</option>
            </select>
          </div>
        </div>
        <table class="itin-list" id="itinTable">
          <thead>
            <tr><th>FLIGHT(S)</th><th>DEPARTURE</th><th>ARRIVAL</th><th>LEGS</th><th>TOTAL TIME</th><th>TYPE</th><th></th></tr>
          </thead>
          <tbody id="itinTableBody"></tbody>
        </table>
      </div>
    </div>`;
  renderTable();
}

function renderTable() {
  const sorted = applySortAndFilter(currentItineraries);
  const tbody = document.getElementById('itinTableBody');

  if (sorted.length === 0) {
    tbody.innerHTML = `<tr><td colspan="7" class="empty-state">NO ITINERARIES MATCH THIS FILTER.</td></tr>`;
    return;
  }

  tbody.innerHTML = sorted.map(itin => {
    const key = itinKey(itin);
    const isExpanded = key === expandedKey;
    const typeTag = itin.domestic
      ? `<span class="tag-domestic">DOMESTIC</span>`
      : `<span class="tag-international">INTL</span>`;
    const row = `
      <tr class="itin-row ${isExpanded ? 'expanded' : ''}" onclick="toggleItinerary('${key}')">
        <td>${itin.flight_numbers.join(' / ')}</td>
        <td>${itin.departure_icao} (${itin.departure_country})</td>
        <td>${itin.arrival_icao} (${itin.arrival_country})</td>
        <td>${itin.legs}</td>
        <td>${fmtMinutes(itin.total_minutes)}</td>
        <td>${typeTag}</td>
        <td class="select-cell"><button class="action small" onclick="event.stopPropagation(); toggleItinerary('${key}')">${isExpanded ? 'CLOSE' : 'SELECT'}</button></td>
      </tr>`;
    const detailRow = isExpanded
      ? `<tr><td colspan="7" class="detail-cell" id="detailCell"><div class="empty-state">LOADING...</div></td></tr>`
      : '';
    return row + detailRow;
  }).join('');

  if (expandedKey) loadDetail(expandedKey);
}

async function toggleItinerary(key) {
  if (expandedKey === key) {
    expandedKey = null;
  } else {
    expandedKey = key;
  }
  renderTable();
}

async function loadDetail(key) {
  const cell = document.getElementById('detailCell');
  try {
    const resp = await fetch(`/select?flights=${encodeURIComponent(key)}`);
    const data = await resp.json();
    cell.innerHTML = buildDetailHtml(data);
  } catch (err) {
    cell.innerHTML = `<div class="empty-state">COULD NOT LOAD FLIGHT DETAILS.</div>`;
  }
}

function buildDetailHtml(data) {
  const legBlocks = data.legs.map((leg, i) => `
    <div class="leg-block">
      <div class="leg-block-header">LEG ${i + 1} &mdash; ${leg.flight_number}</div>
      <div class="leg-block-body">

        <table class="kv" style="margin-bottom:10px;">
          <tr><td class="k">DEPARTURE</td><td class="v">${leg.departure_info.icao} / ${leg.departure_info.iata} &mdash; ${leg.departure_info.name} (${leg.departure_info.country})</td></tr>
          <tr><td class="k">ARRIVAL</td><td class="v">${leg.arrival_info.icao} / ${leg.arrival_info.iata} &mdash; ${leg.arrival_info.name} (${leg.arrival_info.country})</td></tr>
          <tr><td class="k">COST INDEX</td><td class="v">${leg.cost_index}</td></tr>
        </table>

        <table class="kv" style="margin-bottom:10px;">
          <tr><td class="k">EXPECTED PAX</td><td class="v">${leg.pax_count} / 189</td></tr>
          <tr><td class="k">EXPECTED LOAD FACTOR</td><td class="v">${(leg.load_factor * 100).toFixed(0)}%</td></tr>
          <tr><td class="k">EXPECTED CARGO/BAGS</td><td class="v">${leg.cargo_weight_kg} KG</td></tr>
        </table>
        <p class="placeholder-text" style="margin-bottom:10px;">Figures are expected/preliminary and may change before pushback.</p>

        <div class="weather-block">
          <div class="weather-row"><span class="weather-label">METAR ${leg.departure_info.icao}</span><span class="weather-text">${leg.weather.departure.metar || 'UNAVAILABLE'}</span></div>
          <div class="weather-row"><span class="weather-label">TAF ${leg.departure_info.icao}</span><span class="weather-text">${leg.weather.departure.taf || 'UNAVAILABLE'}</span></div>
          <div class="weather-row"><span class="weather-label">METAR ${leg.arrival_info.icao}</span><span class="weather-text">${leg.weather.arrival.metar || 'UNAVAILABLE'}</span></div>
          <div class="weather-row"><span class="weather-label">TAF ${leg.arrival_info.icao}</span><span class="weather-text">${leg.weather.arrival.taf || 'UNAVAILABLE'}</span></div>
        </div>

        <p class="placeholder-text" style="margin-top:10px;">
          ${leg.dangerous_goods.id === 'dg-05'
            ? `<span class="status-chip status-ok">DG CLEAR</span>`
            : `<span class="status-chip status-warn">DG: ${leg.dangerous_goods.label}</span>`}
        </p>
        <p class="placeholder-text" style="margin-top:8px;">
          ${leg.delay
            ? `<span class="status-chip status-warn">DELAY ${leg.delay.iata_code}</span> ${leg.delay.description} (${leg.delay.duration_range_minutes[0]}&ndash;${leg.delay.duration_range_minutes[1]} min)`
            : `<span class="status-chip status-ok">ON TIME</span>`}
        </p>
      </div>
    </div>`).join('');

  return `
    <div class="detail-inner">
      ${legBlocks}
      <p class="placeholder-text" style="margin-bottom:10px;">MEL status will be loaded from the SimBrief FPL at a later stage - not shown here. Last-minute changes will be shown at loadsheet sign-off - not shown here.</p>
      <div class="generate-row">
        <button class="action" onclick="dummyGenerate('${data.session_id}')">GENERATE (SENDS TO SIMBRIEF)</button>
      </div>
    </div>`;
}

function dummyGenerate(sessionId) {
  // Placeholder - SimBrief integration (step 5) not wired up yet.
  alert(`GENERATE pressed for session ${sessionId}.\nSimBrief integration not yet connected - this is a placeholder.`);
}
</script>

</body>
</html>
