<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SimDispatch</title>
<style>
  :root {
    --face:        #ECE9D8;  /* Windows 2000/XP classic grey-beige */
    --face-dark:   #D4D0C8;
    --titlebar:    #6B7A99;  /* muted steel blue-grey, 2000-style */
    --titlebar-2:  #93A3B8;
    --white:       #FFFFFF;
    --shadow-dk:   #716F64;
    --shadow-md:   #ACA899;
    --text:        #000000;
    --text-muted:  #444444;
    --amber:       #7A6A00;
    --amber-bg:    #F5EFC0;
    --green:       #245C24;
    --green-bg:    #DCEEDC;
    --red:         #FFFFFF;
    --red-bg:      #7A2626;
    --link:        #2A4B8D;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--face-dark);
    color: var(--text);
    font-family: 'Courier New', Consolas, monospace;
    font-size: 13px;
    line-height: 1.5;
  }

  .topbar {
    background: linear-gradient(90deg, var(--titlebar), var(--titlebar-2));
    color: #fff;
    padding: 5px 8px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 2px solid var(--shadow-dk);
  }
  .topbar .title { font-weight: 700; font-size: 13px; letter-spacing: 0.02em; }
  .topbar .clock { font-size: 12px; }

  main { max-width: 920px; margin: 16px auto; padding: 0 16px 60px; }

  .panel {
    background: var(--face);
    margin-bottom: 16px;
    border-style: solid; border-width: 2px;
    border-top-color: var(--white); border-left-color: var(--white);
    border-bottom-color: var(--shadow-dk); border-right-color: var(--shadow-dk);
  }
  .panel-header {
    background: linear-gradient(90deg, var(--titlebar), var(--titlebar-2));
    color: #fff; font-weight: 700; font-size: 12px;
    padding: 4px 8px;
  }
  .panel-body { padding: 12px 14px; }

  .params-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px 16px;
    margin-bottom: 12px;
  }
  @media (max-width: 560px) { .params-grid { grid-template-columns: 1fr; } }

  .field label { display: block; font-size: 12px; color: var(--text); margin-bottom: 3px; }
  .field .hint { color: var(--text-muted); font-size: 11px; font-weight: normal; }
  .field input, .field select {
    font-family: 'Courier New', Consolas, monospace; font-size: 13px; padding: 5px 7px;
    background: var(--white); color: var(--text); width: 100%;
    border-style: solid; border-width: 2px;
    border-top-color: var(--shadow-dk); border-left-color: var(--shadow-dk);
    border-bottom-color: var(--white); border-right-color: var(--white);
  }
  .field input:focus, .field select:focus { outline: 1px dotted var(--text); outline-offset: 1px; }
  .field-error {
    color: #7A2626; font-size: 11px; margin-top: 3px; display: none;
  }
  .field-error.show { display: block; }

  button.action {
    font-family: 'Courier New', Consolas, monospace; font-weight: 700; font-size: 13px;
    background: var(--face); color: var(--text); padding: 6px 20px; cursor: pointer;
    border-style: solid; border-width: 2px;
    border-top-color: var(--white); border-left-color: var(--white);
    border-bottom-color: var(--shadow-dk); border-right-color: var(--shadow-dk);
  }
  button.action:active {
    border-top-color: var(--shadow-dk); border-left-color: var(--shadow-dk);
    border-bottom-color: var(--white); border-right-color: var(--white);
  }
  button.action:disabled { color: var(--shadow-md); cursor: default; }

  /* ---- itinerary results list ---- */
  table.itin-list { width: 100%; border-collapse: collapse; }
  table.itin-list th {
    text-align: left; font-size: 11px; color: var(--text-muted); font-weight: normal;
    padding: 4px 6px; border-bottom: 2px solid var(--shadow-md);
  }
  table.itin-list td {
    padding: 5px 6px; border-bottom: 1px solid var(--shadow-md); font-size: 12.5px;
  }
  table.itin-list tr.itin-row:hover { background: var(--face-dark); cursor: pointer; }
  table.itin-list td.select-cell { width: 70px; }

  .results-grid { display: grid; grid-template-columns: 1fr; gap: 16px; }
  @media (min-width: 700px) {
    .results-grid { grid-template-columns: 1fr 1fr; }
    .results-grid .panel { margin-bottom: 0; }
    .panel.span-2 { grid-column: 1 / -1; }
  }

  .kv { width: 100%; border-collapse: collapse; }
  .kv td { padding: 4px 0; border-bottom: 1px solid var(--shadow-md); vertical-align: top; }
  .kv tr:last-child td { border-bottom: none; }
  .kv td.k { color: var(--text); width: 44%; font-size: 12px; }
  .kv td.v { font-size: 13px; font-weight: 700; }

  .status-chip {
    display: inline-block; font-size: 11.5px;
    font-weight: 700; padding: 2px 8px; border: 1px solid var(--shadow-dk);
  }
  .status-ok    { background: var(--green-bg); color: var(--green); }
  .status-warn  { background: var(--amber-bg); color: var(--amber); }
  .status-alert { background: var(--red-bg);   color: var(--red); }

  .placeholder-text { color: var(--text); font-size: 13px; }
  .empty-state { padding: 26px 16px; text-align: center; color: var(--text-muted); font-size: 13px; }

  footer { max-width: 920px; margin: 0 auto; padding: 0 16px 30px; color: #3A3A3A; font-size: 11px; }
</style>
</head>
<body>

<div class="topbar">
  <div class="title">SimDispatch</div>
  <div class="clock" id="clock">--:--:--Z</div>
</div>

<main>

  <div class="panel">
    <div class="panel-header">SEARCH PARAMETERS</div>
    <div class="panel-body">
      <div class="params-grid">
        <div class="field">
          <label for="origin">PREFERRED BASE <span class="hint">(ICAO/IATA, optional)</span></label>
          <input type="text" id="origin" list="airportList" autocomplete="off" placeholder="e.g. BGY or LIME">
          <div class="field-error" id="originError">UNKNOWN AIRPORT CODE</div>
        </div>
        <div class="field">
          <label for="destination">PREFERRED DESTINATION <span class="hint">(ICAO/IATA, optional)</span></label>
          <input type="text" id="destination" list="airportList" autocomplete="off" placeholder="e.g. STN or EGSS">
          <div class="field-error" id="destinationError">UNKNOWN AIRPORT CODE</div>
        </div>
        <div class="field">
          <label for="minutes">TIME AVAILABLE (MIN)</label>
          <input type="number" id="minutes" value="180" min="20" step="5">
        </div>
        <div class="field">
          <label for="legs">NUMBER OF LEGS</label>
          <select id="legs">
            <option value="">AUTO</option>
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
          </select>
        </div>
      </div>
      <datalist id="airportList"></datalist>
      <button class="action" id="searchBtn" onclick="searchFlights()">SEARCH</button>
    </div>
  </div>

  <div id="listPanel"></div>
  <div id="detailPanel"></div>

</main>

<footer>
  DATASET: {{ counts.routes }} ROUTES &middot; {{ counts.mels }} MEL SCENARIOS &middot; {{ counts.delay_codes }} DELAY CODES
</footer>

<script>
function updateClock() {
  const now = new Date();
  const hh = String(now.getUTCHours()).padStart(2, '0');
  const mm = String(now.getUTCMinutes()).padStart(2, '0');
  const ss = String(now.getUTCSeconds()).padStart(2, '0');
  document.getElementById('clock').textContent = `${hh}:${mm}:${ss}Z`;
}
updateClock();
setInterval(updateClock, 1000);

function fmtMinutes(min) {
  const h = Math.floor(min / 60);
  const m = min % 60;
  return `${h}H${String(m).padStart(2, '0')}M`;
}

// ---- airport autocomplete ----
let airportCache = {};
async function updateAirportList(query) {
  if (!query || query.length < 1) return;
  const resp = await fetch(`/airports/search?q=${encodeURIComponent(query)}`);
  const matches = await resp.json();
  const list = document.getElementById('airportList');
  list.innerHTML = '';
  matches.forEach(a => {
    const opt = document.createElement('option');
    opt.value = a.icao;
    opt.label = `${a.icao} / ${a.iata} - ${a.city}`;
    list.appendChild(opt);
    airportCache[a.icao] = a;
    airportCache[a.iata] = a;
  });
}
['origin', 'destination'].forEach(id => {
  document.getElementById(id).addEventListener('input', (e) => updateAirportList(e.target.value));
});

async function validateAirport(fieldId) {
  const field = document.getElementById(fieldId);
  const errorEl = document.getElementById(fieldId + 'Error');
  const value = field.value.trim();
  if (!value) { errorEl.classList.remove('show'); return true; }
  const resp = await fetch(`/airports/validate?code=${encodeURIComponent(value)}`);
  const result = await resp.json();
  errorEl.classList.toggle('show', !result.valid);
  return result.valid;
}
['origin', 'destination'].forEach(id => {
  document.getElementById(id).addEventListener('blur', () => validateAirport(id));
});

// ---- search ----
async function searchFlights() {
  const originValid = await validateAirport('origin');
  const destValid = await validateAirport('destination');
  if (!originValid || !destValid) return;

  const origin = document.getElementById('origin').value.trim();
  const destination = document.getElementById('destination').value.trim();
  const minutes = document.getElementById('minutes').value;
  const legs = document.getElementById('legs').value;

  const btn = document.getElementById('searchBtn');
  btn.disabled = true;
  btn.textContent = 'SEARCHING...';

  document.getElementById('detailPanel').innerHTML = '';

  try {
    const params = new URLSearchParams({ minutes, legs, origin, destination });
    const resp = await fetch(`/search?${params}`);
    const data = await resp.json();

    if (data.error) {
      document.getElementById('listPanel').innerHTML = `
        <div class="panel"><div class="empty-state">${data.error}</div></div>`;
      return;
    }

    if (data.count === 0) {
      document.getElementById('listPanel').innerHTML = `
        <div class="panel"><div class="empty-state">NO ITINERARIES MATCH THESE PARAMETERS. WIDEN THE TIME AVAILABLE OR CLEAR A FILTER.</div></div>`;
      return;
    }

    renderList(data.itineraries);
  } catch (err) {
    document.getElementById('listPanel').innerHTML = `
      <div class="panel"><div class="empty-state">SEARCH FAILED. CHECK CONNECTION AND RETRY.</div></div>`;
  } finally {
    btn.disabled = false;
    btn.textContent = 'SEARCH';
  }
}

function renderList(itineraries) {
  const rows = itineraries.map(itin => `
    <tr class="itin-row" onclick="selectItinerary('${itin.flight_numbers.join(',')}')">
      <td>${itin.flight_numbers.join(' / ')}</td>
      <td>${itin.path.join(' \u2192 ')}</td>
      <td>${itin.legs}</td>
      <td>${fmtMinutes(itin.total_minutes)}</td>
      <td class="select-cell"><button class="action" onclick="event.stopPropagation(); selectItinerary('${itin.flight_numbers.join(',')}')">SELECT</button></td>
    </tr>`).join('');

  document.getElementById('listPanel').innerHTML = `
    <div class="panel">
      <div class="panel-header">MATCHING ITINERARIES (${itineraries.length})</div>
      <div class="panel-body">
        <table class="itin-list">
          <tr><th>FLIGHT(S)</th><th>ROUTING</th><th>LEGS</th><th>TOTAL TIME</th><th></th></tr>
          ${rows}
        </table>
      </div>
    </div>`;
}

// ---- selection -> full conditions ----
async function selectItinerary(flightNumbers) {
  const detailPanel = document.getElementById('detailPanel');
  detailPanel.innerHTML = `<div class="panel"><div class="empty-state">LOADING FLIGHT DETAILS...</div></div>`;

  try {
    const resp = await fetch(`/select?flights=${encodeURIComponent(flightNumbers)}`);
    const data = await resp.json();
    renderDetail(data);
    detailPanel.scrollIntoView({ behavior: 'smooth', block: 'start' });
  } catch (err) {
    detailPanel.innerHTML = `<div class="panel"><div class="empty-state">COULD NOT LOAD FLIGHT DETAILS.</div></div>`;
  }
}

function renderDetail(data) {
  const detailPanel = document.getElementById('detailPanel');
  const legs = data.itinerary;
  const legRows = legs.map((l, i) => `
    <tr><td class="k">LEG ${i + 1}</td><td class="v">${l.flight_number}: ${l.departure_icao} \u2192 ${l.arrival_icao} (${fmtMinutes(l.duration_minutes)}, ${l.distance_nm} NM)</td></tr>
  `).join('');

  detailPanel.innerHTML = `
    <div class="results-grid">
    <div class="panel span-2">
      <div class="panel-header">ITINERARY</div>
      <div class="panel-body">
        <table class="kv">${legRows}</table>
      </div>
    </div>

    <div class="panel">
      <div class="panel-header">LOAD &amp; CARGO</div>
      <div class="panel-body">
        <table class="kv">
          <tr><td class="k">PAX</td><td class="v">${data.pax_count} / 189</td></tr>
          <tr><td class="k">LOAD FACTOR</td><td class="v">${(data.load_factor * 100).toFixed(0)}%</td></tr>
          <tr><td class="k">CARGO/BAGS</td><td class="v">${data.cargo_weight_kg} KG</td></tr>
        </table>
      </div>
    </div>

    <div class="panel">
      <div class="panel-header">DANGEROUS GOODS</div>
      <div class="panel-body">
        ${data.dangerous_goods.id === 'dg-05'
          ? `<span class="status-chip status-ok">CLEAR</span><p class="placeholder-text" style="margin-top:8px;">No dangerous goods on this sector.</p>`
          : `<span class="status-chip status-warn">MANIFEST NOTE</span><p class="placeholder-text" style="margin-top:8px;">${data.dangerous_goods.label}</p>`
        }
      </div>
    </div>

    <div class="panel">
      <div class="panel-header">MEL STATUS</div>
      <div class="panel-body">
        ${data.mel
          ? `<span class="status-chip status-alert">OPEN ITEM</span>
             <table class="kv" style="margin-top:8px;">
               <tr><td class="k">SYSTEM</td><td class="v">${data.mel.system}</td></tr>
               <tr><td class="k">CATEGORY</td><td class="v">${data.mel.mel_category}</td></tr>
               <tr><td class="k">DETAIL</td><td class="v" style="font-weight:400;">${data.mel.description}</td></tr>
             </table>
             <p class="placeholder-text" style="margin-top:8px;">${data.mel.dispatch_consequence}</p>`
          : `<span class="status-chip status-ok">SERVICEABLE</span><p class="placeholder-text" style="margin-top:8px;">No open MEL items. Aircraft fully serviceable.</p>`
        }
      </div>
    </div>

    <div class="panel">
      <div class="panel-header">DELAY</div>
      <div class="panel-body">
        ${data.delay
          ? `<span class="status-chip status-warn">DELAY CODE ${data.delay.iata_code}</span>
             <p class="placeholder-text" style="margin-top:8px;">${data.delay.description}</p>
             <table class="kv" style="margin-top:6px;">
               <tr><td class="k">EXPECTED</td><td class="v">${data.delay.duration_range_minutes[0]}&ndash;${data.delay.duration_range_minutes[1]} MIN</td></tr>
             </table>`
          : `<span class="status-chip status-ok">ON TIME</span><p class="placeholder-text" style="margin-top:8px;">No delay reported.</p>`
        }
      </div>
    </div>

    <div class="panel">
      <div class="panel-header">LAST-MINUTE CHANGE</div>
      <div class="panel-body">
        ${data.lmc_event
          ? `<span class="status-chip status-warn">LMC</span>
             <p class="placeholder-text" style="margin-top:8px;">${data.lmc_event.description}</p>
             <table class="kv" style="margin-top:6px;">
               <tr><td class="k">DELTA</td><td class="v">${data.lmc_event.delta > 0 ? '+' : ''}${data.lmc_event.delta} ${data.lmc_event.unit.toUpperCase()}</td></tr>
             </table>`
          : `<span class="status-chip status-ok">NONE</span><p class="placeholder-text" style="margin-top:8px;">Loadsheet unchanged from initial figures.</p>`
        }
      </div>
    </div>
    </div>
  `;
}
</script>

</body>
</html>
