<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VirtualDispatch &mdash; Set up your profile</title>
{% include "_favicons.html" %}
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --face: #FFFFFF; --face-dark: #F3F4F6; --titlebar: #1D4ED8; --titlebar-2: #2563EB;
    --text: #101828; --text-muted: #667085; --shadow-dk: #D0D5DD; --red: #B42318;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: var(--face-dark); color: var(--text); padding: 24px 0;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    font-size: 14px;
  }
  .panel {
    width: 92%; max-width: 480px;
    background: var(--face); border: 1px solid var(--shadow-dk); border-radius: 12px;
    box-shadow: 0 4px 16px rgba(16,24,40,0.08); overflow: hidden;
  }
  .panel-header { background: var(--titlebar); color: #fff; padding: 18px 22px; }
  .panel-header h1 { font-size: 17px; margin: 0 0 4px; font-weight: 600; }
  .panel-header p { margin: 0; font-size: 13px; opacity: 0.9; }
  .panel-body { padding: 22px; }
  label { display: block; font-size: 12.5px; font-weight: 500; margin-bottom: 5px; margin-top: 16px; }
  label:first-child { margin-top: 0; }
  .hint { font-weight: 400; color: var(--text-muted); font-size: 11.5px; }
  input[type="text"], input[type="date"], select {
    width: 100%; font-family: inherit; font-size: 14px; padding: 9px 11px;
    background: var(--face); color: var(--text);
    border: 1px solid var(--shadow-dk); border-radius: 6px;
  }
  input:focus, select:focus { outline: none; border-color: var(--titlebar); box-shadow: 0 0 0 3px rgba(37,99,235,0.15); }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .photo-row { display: flex; align-items: center; gap: 14px; margin-top: 16px; }
  .photo-preview {
    width: 56px; height: 56px; border-radius: 50%; background: var(--face-dark);
    display: flex; align-items: center; justify-content: center; overflow: hidden; flex-shrink: 0;
    border: 1px solid var(--shadow-dk); color: var(--text-muted); font-size: 11px;
  }
  .photo-preview img { width: 100%; height: 100%; object-fit: cover; }
  .error { color: var(--red); font-size: 12.5px; margin: 14px 0 0; }
  button {
    margin-top: 22px; width: 100%; font-family: inherit; font-size: 14px; font-weight: 600;
    background: var(--titlebar); color: #fff; padding: 10px; cursor: pointer;
    border: none; border-radius: 6px;
  }
  button:hover { background: var(--titlebar-2); }
  .skip { text-align: center; margin-top: 12px; }
  .skip a { color: var(--text-muted); font-size: 12.5px; text-decoration: underline; }
</style>
</head>
<body>
  <div class="panel">
    <div class="panel-header">
      <h1>Set up your profile</h1>
      <p>A few details so your account is ready to fly.</p>
    </div>
    <div class="panel-body">
      <form method="POST" enctype="multipart/form-data">
        <div class="photo-row">
          <div class="photo-preview" id="photoPreview">No photo</div>
          <div style="flex:1;">
            <label for="photo" style="margin:0;">Profile photo <span class="hint">(optional, JPEG/PNG/WebP, max 2MB)</span></label>
            <input type="file" id="photo" name="photo" accept="image/jpeg,image/png,image/webp">
          </div>
        </div>

        <label for="username">Username</label>
        <input type="text" id="username" name="username" required pattern="[A-Za-z0-9_]{3,20}" autocomplete="off">

        <div class="row2">
          <div>
            <label for="first_name">First name <span class="hint">(optional)</span></label>
            <input type="text" id="first_name" name="first_name" autocomplete="off">
          </div>
          <div>
            <label for="last_name">Last name <span class="hint">(optional)</span></label>
            <input type="text" id="last_name" name="last_name" autocomplete="off">
          </div>
        </div>

        <div class="row2">
          <div>
            <label for="birth_date">Date of birth <span class="hint">(optional)</span></label>
            <input type="date" id="birth_date" name="birth_date">
          </div>
          <div>
            <label for="nationality">Nationality <span class="hint">(optional)</span></label>
            <select id="nationality" name="nationality">
              <option value="">&mdash;</option>
              {% for c in countries %}<option value="{{ c }}">{{ c }}</option>{% endfor %}
            </select>
          </div>
        </div>

        <label for="preferred_base">Preferred base <span class="hint">(optional, ICAO or IATA &mdash; e.g. EIDW or DUB)</span></label>
        <input type="text" id="preferred_base" name="preferred_base" autocomplete="off" maxlength="4" style="text-transform:uppercase;">

        {% if error %}<p class="error">{{ error }}</p>{% endif %}
        <button type="submit">Continue</button>
      </form>
      <div class="skip"><a href="{{ url_for('dispatch_app') }}">Skip for now</a></div>
    </div>
  </div>
  <script>
    document.getElementById('photo').addEventListener('change', function (e) {
      const file = e.target.files[0];
      const preview = document.getElementById('photoPreview');
      if (!file) { preview.textContent = 'No photo'; return; }
      const reader = new FileReader();
      reader.onload = function (ev) { preview.innerHTML = `<img src="${ev.target.result}" alt="">`; };
      reader.readAsDataURL(file);
    });
  </script>
</body>
</html>
