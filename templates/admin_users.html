<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VirtualDispatch &mdash; Admin</title>
{% include "_favicons.html" %}
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --face: #FFFFFF; --face-dark: #F3F4F6; --titlebar: #1D4ED8; --titlebar-2: #2563EB;
    --white: #FFFFFF; --shadow-dk: #D0D5DD; --shadow-md: #E4E7EC;
    --text: #101828; --text-muted: #667085; --red: #B42318; --red-bg: #FEF3F2; --green: #067647;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--face-dark); color: var(--text);
         font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
         font-size: 14px; padding: 20px; }
  .panel { max-width: 960px; margin: 0 auto; background: var(--face); border: 1px solid var(--shadow-md);
           border-radius: 10px; box-shadow: 0 1px 2px rgba(16,24,40,0.06); overflow: hidden; }
  .panel-header { background: var(--titlebar); color: #fff;
                  padding: 14px 18px; font-weight: 600; font-size: 15px; display: flex; justify-content: space-between; align-items: center; }
  .panel-header a { color: #fff; font-size: 13px; text-decoration: none; opacity: 0.9; }
  .panel-header a:hover { opacity: 1; text-decoration: underline; }
  .panel-body { padding: 18px; overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { border-bottom: 1px solid var(--shadow-md); padding: 9px 10px; text-align: left; white-space: nowrap; }
  th { color: var(--text-muted); font-weight: 600; font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.03em; }
  .banned { color: var(--red); font-weight: 600; }
  .ok { color: var(--green); }
  button { font-family: inherit; font-size: 12px; font-weight: 500; padding: 5px 10px; cursor: pointer;
           margin-right: 6px; border: 1px solid var(--shadow-dk); border-radius: 6px; background: var(--face); }
  button:hover { background: var(--face-dark); }
  .empty-state, .error-state { padding: 14px 0; }
  .error-state { color: var(--red); }
</style>
</head>
<body>
  <div class="panel">
    <div class="panel-header">
      <span>VirtualDispatch &mdash; User management</span>
      <a href="/app">&larr; Back to app</a>
    </div>
    <div class="panel-body" id="body">Loading&hellip;</div>
  </div>
<script>
async function load() {
  const body = document.getElementById('body');
  try {
    const resp = await fetch('/admin/api/users');
    const users = await resp.json();
    if (!resp.ok) throw new Error(users.error || 'Failed to load users.');
    if (!users.length) { body.innerHTML = '<div class="empty-state">No users yet.</div>'; return; }
    const rows = users.map(u => {
      const banned = !!u.banned_until && new Date(u.banned_until) > new Date();
      return `<tr>
        <td>${esc(u.email || '')}</td>
        <td class="${u.email_confirmed_at ? 'ok' : ''}">${u.email_confirmed_at ? 'Verified' : 'Pending'}</td>
        <td>${fmt(u.created_at)}</td>
        <td>${fmt(u.last_sign_in_at)}</td>
        <td class="${banned ? 'banned' : ''}">${banned ? 'Banned' : 'Active'}</td>
        <td>
          <button onclick="ban('${u.id}', ${!banned})">${banned ? 'Unban' : 'Ban'}</button>
          <button onclick="del('${u.id}', '${esc(u.email || '')}')">Delete</button>
        </td>
      </tr>`;
    }).join('');
    body.innerHTML = `<table>
      <thead><tr><th>Email</th><th>Status</th><th>Created</th><th>Last sign-in</th><th>Access</th><th></th></tr></thead>
      <tbody>${rows}</tbody>
    </table>`;
  } catch (err) {
    body.innerHTML = `<div class="error-state">${esc(err.message)}</div>`;
  }
}
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmt(s) { return s ? new Date(s).toLocaleString() : '—'; }
async function ban(id, banned) {
  await fetch(`/admin/api/users/${id}/ban`, {
    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ banned }),
  });
  load();
}
async function del(id, email) {
  if (!confirm(`Permanently delete ${email}? This cannot be undone.`)) return;
  await fetch(`/admin/api/users/${id}`, { method: 'DELETE' });
  load();
}
load();
</script>
</body>
</html>
