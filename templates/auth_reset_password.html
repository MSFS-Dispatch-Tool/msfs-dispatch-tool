<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VirtualDispatch &mdash; Set a new password</title>
{% include "_favicons.html" %}
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --face:        #FFFFFF;
    --face-dark:   #F3F4F6;
    --titlebar:    #1D4ED8;
    --titlebar-2:  #2563EB;
    --text:        #101828;
    --text-muted:  #667085;
    --border:      #D0D5DD;
    --red:         #B42318;

    --sp-2: 8px; --sp-3: 12px; --sp-5: 20px; --sp-6: 24px; --sp-7: 28px;
    --radius: 8px;
    --control-height: 44px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: var(--face-dark); color: var(--text);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    font-size: 14px; line-height: 1.5;
    padding: var(--sp-6) 0;
  }
  .panel {
    width: 92%; max-width: 400px;
    background: var(--face); border: 1px solid var(--border); border-radius: 12px;
    box-shadow: 0 4px 16px rgba(16,24,40,0.08);
    overflow: hidden;
  }
  .panel-header { background: var(--titlebar); color: #fff; padding: var(--sp-6) var(--sp-7); }
  .panel-header h1 { font-size: 18px; margin: 0 0 4px; font-weight: 600; line-height: 1.3; }
  .panel-header p { margin: 0; font-size: 13.5px; opacity: 0.85; line-height: 1.4; }
  .panel-body { padding: var(--sp-7); }

  .field { margin-bottom: var(--sp-5); }
  .field label { display: block; font-size: 13px; font-weight: 600; margin-bottom: var(--sp-2); }

  input[type="password"] {
    width: 100%; height: var(--control-height); font-family: inherit; font-size: 14px; padding: 0 var(--sp-3);
    background: var(--face); color: var(--text);
    border: 1px solid var(--border); border-radius: var(--radius);
  }
  input[type="password"]:focus {
    outline: none; border-color: var(--titlebar); box-shadow: 0 0 0 3px rgba(37,99,235,0.15);
  }

  .password-hint { font-size: 12px; color: var(--text-muted); margin: var(--sp-2) 0 0; }
  .strength-bar { height: 4px; border-radius: 2px; background: var(--face-dark); margin-top: var(--sp-2); overflow: hidden; }
  .strength-bar-fill { height: 100%; width: 0%; border-radius: 2px; background: var(--red); transition: width 0.15s ease, background 0.15s ease; }
  .strength-label { font-size: 12px; margin-top: 4px; color: var(--text-muted); }

  .error {
    color: var(--red); font-size: 13px; margin: 0 0 var(--sp-5);
    padding: var(--sp-3); background: #FEF3F2; border: 1px solid #FDA29B; border-radius: var(--radius);
  }

  button[type="submit"] {
    width: 100%; height: var(--control-height);
    font-family: inherit; font-size: 14.5px; font-weight: 600;
    background: var(--titlebar); color: #fff; cursor: pointer;
    border: none; border-radius: var(--radius); transition: background 0.12s ease;
  }
  button[type="submit"]:hover { background: var(--titlebar-2); }
</style>
</head>
<body>
  <div class="panel">
    <div class="panel-header">
      <h1>Set a new password</h1>
      <p>Choose a new password for your account.</p>
    </div>
    <div class="panel-body">
      {% if error %}<p class="error">{{ error }}</p>{% endif %}
      <form method="POST">
        <div class="field">
          <label for="password">New password</label>
          <input type="password" id="password" name="password" required minlength="8" oninput="updateStrength()">
          <p class="password-hint">At least 8 characters, with a letter, a number, and a symbol.</p>
          <div class="strength-bar"><div class="strength-bar-fill" id="strengthFill"></div></div>
          <div class="strength-label" id="strengthLabel">&nbsp;</div>
        </div>
        <div class="field">
          <label for="password_confirm">Confirm new password</label>
          <input type="password" id="password_confirm" name="password_confirm" required minlength="8">
        </div>
        <button type="submit">Set new password</button>
      </form>
    </div>
  </div>
  <script>
    function updateStrength() {
      const value = document.getElementById('password').value;
      const fill = document.getElementById('strengthFill');
      const label = document.getElementById('strengthLabel');
      if (!value) { fill.style.width = '0%'; fill.style.background = '#B42318'; label.textContent = ' '; return; }

      let score = 0;
      if (value.length >= 8) score++;
      if (value.length >= 12) score++;
      if (/[A-Z]/.test(value) && /[a-z]/.test(value)) score++;
      if (/[0-9]/.test(value)) score++;
      if (/[^A-Za-z0-9]/.test(value)) score++;

      const levels = [
        { pct: 20,  color: '#B42318', label: 'Very weak' },
        { pct: 40,  color: '#B54708', label: 'Weak' },
        { pct: 60,  color: '#B54708', label: 'Fair' },
        { pct: 80,  color: '#067647', label: 'Good' },
        { pct: 100, color: '#067647', label: 'Strong' },
      ];
      const level = levels[Math.min(score, levels.length - 1)];
      fill.style.width = level.pct + '%';
      fill.style.background = level.color;
      label.textContent = level.label;
    }
  </script>
</body>
</html>
