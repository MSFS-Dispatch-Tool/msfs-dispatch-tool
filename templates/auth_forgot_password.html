<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VirtualDispatch &mdash; Reset your password</title>
{% include "_favicons.html" %}
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --face:        #FFFFFF;
    --face-dark:   #F3F4F6;
    --titlebar:    #1D4ED8;
    --titlebar-2:  #2563EB;
    --text:        #101828;
    --text-muted:  #667085;
    --border:      #D0D5DD;
    --red:         #B42318;
    --green:       #067647;

    --sp-2: 8px; --sp-3: 12px; --sp-5: 20px; --sp-6: 24px; --sp-7: 28px;
    --radius: 8px;
    --control-height: 44px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: var(--face-dark); color: var(--text);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    font-size: 14px; line-height: 1.5;
    padding: var(--sp-6) 0;
  }
  .panel {
    width: 92%; max-width: 400px;
    background: var(--face); border: 1px solid var(--border); border-radius: 12px;
    box-shadow: 0 4px 16px rgba(16,24,40,0.08);
    overflow: hidden;
  }
  .panel-header { background: var(--titlebar); color: #fff; padding: var(--sp-6) var(--sp-7); }
  .panel-header h1 { font-size: 18px; margin: 0 0 4px; font-weight: 600; line-height: 1.3; }
  .panel-header p { margin: 0; font-size: 13.5px; opacity: 0.85; line-height: 1.4; }
  .panel-body { padding: var(--sp-7); }

  .field { margin-bottom: var(--sp-5); }
  .field label { display: block; font-size: 13px; font-weight: 600; margin-bottom: var(--sp-2); }

  input[type="email"] {
    width: 100%; height: var(--control-height); font-family: inherit; font-size: 14px; padding: 0 var(--sp-3);
    background: var(--face); color: var(--text);
    border: 1px solid var(--border); border-radius: var(--radius);
  }
  input[type="email"]:focus {
    outline: none; border-color: var(--titlebar); box-shadow: 0 0 0 3px rgba(37,99,235,0.15);
  }

  .error {
    color: var(--red); font-size: 13px; margin: 0 0 var(--sp-5);
    padding: var(--sp-3); background: #FEF3F2; border: 1px solid #FDA29B; border-radius: var(--radius);
  }
  .notice {
    color: var(--green); font-size: 13px; margin: 0 0 var(--sp-5);
    padding: var(--sp-3); background: #ECFDF3; border: 1px solid #A6F4C5; border-radius: var(--radius);
  }

  button[type="submit"] {
    width: 100%; height: var(--control-height);
    font-family: inherit; font-size: 14.5px; font-weight: 600;
    background: var(--titlebar); color: #fff; cursor: pointer;
    border: none; border-radius: var(--radius); transition: background 0.12s ease;
  }
  button[type="submit"]:hover { background: var(--titlebar-2); }

  .switch { margin-top: var(--sp-5); font-size: 13.5px; text-align: center; color: var(--text-muted); }
  .switch a { color: var(--titlebar); font-weight: 500; text-decoration: none; }
  .switch a:hover { text-decoration: underline; }
</style>
</head>
<body>
  <div class="panel">
    <div class="panel-header">
      <h1>Reset your password</h1>
      <p>Enter the email on your account and we'll send you a reset link.</p>
    </div>
    <div class="panel-body">
      {% if error %}<p class="error">{{ error }}</p>{% endif %}
      {% if notice %}<p class="notice">{{ notice }}</p>{% endif %}
      <form method="POST">
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" autofocus required>
        </div>
        <button type="submit">Send reset link</button>
      </form>
      <div class="switch"><a href="{{ url_for('login') }}">Back to sign in</a></div>
    </div>
  </div>
</body>
</html>
