name: Tests

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch or pull request cancels the older run
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vd_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/vd_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: pip install -r tests/requirements.txt
      # Static checks and unit tests (the database ones included); the
      # browser suites are the job below
      - run: tests/run_all.sh --quick

  browser:
    # Every browser suite against the real app and a throwaway database,
    # as tests/run_all.sh runs them locally. Screenshots and the server
    # logs are kept when a suite fails.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vd_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/vd_test
      VD_E2E_OUT: ${{ github.workspace }}/e2e-screenshots
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r tests/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: mkdir -p "$VD_E2E_OUT" && python tests/e2e/run.py
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots-and-logs
          path: |
            e2e-screenshots/
            tests/e2e/.server-*.log
          retention-days: 7
